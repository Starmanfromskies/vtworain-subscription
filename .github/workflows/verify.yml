name: Verify subscription installer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Backend regression
        run: |
          python3 -m pip install 'SQLAlchemy>=2.0,<2.1' aiosqlite
          python3 -B -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n install.sh && bash -n tests/install_linux.sh
      - name: Disposable real installation, HTTPS and rollback
        run: bash tests/install_linux.sh
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chrome
      - run: node tests/browser.cjs
  native-panel:
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Native local panel discovery and subscription prefix integration
        env:
          PASARGUARD_TEST_DATABASE: ${{ matrix.database }}
        run: bash tests/install_native_linux.sh
